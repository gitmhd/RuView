image: Visual Studio 2022

install:
  - ps: |
      # Download rustup installer
      Invoke-WebRequest -Uri "https://win.rustup.rs/x86_64" -OutFile "rustup-init.exe"
      
      # Run silent installation
      .\rustup-init.exe -y --default-toolchain stable --profile minimal
      
      # Add Cargo bin to PATH for this script session
      $env:PATH = "C:\Users\appveyor\.cargo\bin;$env:PATH"
      
      # Verify installation
      rustc -vV
      cargo -vV

build_script:
  - ps: |
      $env:PATH = "C:\Users\appveyor\.cargo\bin;$env:PATH"
      cargo build --release --bin sensing-server

after_build:
  - ps: |
      New-Item -ItemType Directory -Path dist
      Copy-Item "target\release\sensing-server.exe" -Destination "dist\"
      Copy-Item -Recurse "ui" -Destination "dist\ui"
      Compress-Archive -Path dist\* -DestinationPath ruview-windows-x64.zip

artifacts:
  - path: ruview-windows-x64.zip
    name: ruview-release
