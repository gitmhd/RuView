image: Visual Studio 2022

install:
  - ps: |
      $ProgressPreference = 'SilentlyContinue'
      Set-Location "C:\projects\ruview"
      git submodule update --init --recursive --depth 1
      Invoke-WebRequest -Uri "https://win.rustup.rs/x86_64" -OutFile "rustup-init.exe"
      .\rustup-init.exe -y --default-toolchain stable --profile minimal

build_script:
  - cmd: |
      set PATH=C:\Users\appveyor\.cargo\bin;%PATH%
      cd C:\projects\ruview\v2
      cargo build --release -p wifi-densepose-sensing-server --bin sensing-server

after_build:
  - cmd: |
      cd C:\projects\ruview
      if not exist dist mkdir dist
      copy /Y v2\target\release\sensing-server.exe dist\
      if exist ui xcopy /E /I /Y ui dist\ui
      if exist v2\ui xcopy /E /I /Y v2\ui dist\ui
      powershell -NoProfile -Command "Compress-Archive -Path dist\* -DestinationPath ruview-windows-x64.zip -Force"

artifacts:
  - path: ruview-windows-x64.zip
    name: ruview-release
