image: Visual Studio 2022

# Enable recursive git submodule checkout
install:
  - ps: |
      # 1. Pull all git submodules (required for vendor/rufield)
      Set-Location "C:\projects\ruview"
      git submodule update --init --recursive
      
      # 2. Download and install Rust toolchain
      Invoke-WebRequest -Uri "https://win.rustup.rs/x86_64" -OutFile "rustup-init.exe"
      .\rustup-init.exe -y --default-toolchain stable --profile minimal
      
      # 3. Add Cargo to PATH and verify
      $env:PATH = "C:\Users\appveyor\.cargo\bin;$env:PATH"
      rustc -vV
      cargo -vV

build_script:
  - ps: |
      $env:PATH = "C:\Users\appveyor\.cargo\bin;$env:PATH"
      
      # Enter the v2 workspace directory
      Set-Location "C:\projects\ruview\v2"
      
      # Build sensing-server in release mode
      cargo build --release -p wifi-densepose-sensing-server --bin sensing-server

after_build:
  - ps: |
      Set-Location "C:\projects\ruview"
      
      # Create dist package
      New-Item -ItemType Directory -Path dist -Force
      Copy-Item "v2\target\release\sensing-server.exe" -Destination "dist\"
      Copy-Item -Recurse "ui" -Destination "dist\ui"
      
      # Compress package
      Compress-Archive -Path dist\* -DestinationPath ruview-windows-x64.zip

artifacts:
  - path: ruview-windows-x64.zip
    name: ruview-release
