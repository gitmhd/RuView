name: Build RuView Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Compile sensing-server
        run: cargo build --release --bin sensing-server

      - name: Bundle Artifacts
        run: |
          mkdir release-bundle
          copy target\release\sensing-server.exe release-bundle\
          xcopy /E /I ui release-bundle\ui

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: ruview-windows-bin
          path: release-bundle/
